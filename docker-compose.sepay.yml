services:
  payment-api:
    environment:
      - SePay__MerchantId=${SEPAY_MERCHANT_ID}
      - SePay__SecretKey=${SEPAY_SECRET_KEY}
      - SePay__Environment=${SEPAY_ENVIRONMENT:-sandbox}
      - SePay__IpnUrl=${SEPAY_IPN_URL}
      - Payment__PublicBaseUrl=${PAYMENT_PUBLIC_BASE_URL}

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - sepay
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          ngrok http gateway-api:8080 --url=https://$$NGROK_DOMAIN --authtoken=$$NGROK_AUTHTOKEN --log=stdout
        else
          ngrok http gateway-api:8080 --authtoken=$$NGROK_AUTHTOKEN --log=stdout
        fi
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
    depends_on:
      gateway-api:
        condition: service_started
    networks:
      - cinema-network
    restart: unless-stopped
